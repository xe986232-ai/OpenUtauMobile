name: Reusable Browser Build

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
      build_number:
        type: number
        default: 0
      source_sha:
        type: string
        default: ''
      action_run_id:
        type: string
        default: ''
      version_lyrics:
        type: string
        default: ''
      aot:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    env:
      AVALONIA_TELEMETRY_OPTOUT: "1"
      VersionLyrics: ${{ inputs.version_lyrics }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools
      - name: Publish Browser
        env:
          PRODUCT_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          ACTION_RUN_ID: ${{ inputs.action_run_id || github.run_id }}
        run: |
          args=()
          if [ -n "$PRODUCT_VERSION" ]; then args+=("-p:Version=$PRODUCT_VERSION"); fi
          if [ "${{ inputs.aot }}" = "true" ]; then args+=("-p:RunAOTCompilation=true" "-p:PublishTrimmed=true" "-p:TrimMode=partial" "-p:WasmEnableThreads=false"); fi
          set +e
          dotnet publish OpenUtauMobile.Browser/OpenUtauMobile.Browser.csproj \
            -c Release -o artifacts/publish/browser-wasm \
            -p:BuildNumber="$BUILD_NUMBER" -p:SourceCommit="$SOURCE_SHA" \
            -p:ActionRunId="$ACTION_RUN_ID" "${args[@]}" 2>&1 | tee publish.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # 把错误行提升为注解，方便不下载完整日志也能看到失败原因
            grep -E "error|Error|ERROR" publish.log | grep -v "warning" | awk '!seen[$0]++' | head -15 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            exit "$code"
          fi
      - name: Package Browser static files
        run: |
          tar -C artifacts/publish/browser-wasm/wwwroot -czf artifacts/OpenUtauMobile-browser-wasm.tar.gz .
          cd artifacts
          sha256sum OpenUtauMobile-browser-wasm.tar.gz > OpenUtauMobile-browser-wasm.tar.gz.sha256
      - name: Upload Browser package
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-browser-wasm
          path: |
            artifacts/OpenUtauMobile-browser-wasm.tar.gz
            artifacts/OpenUtauMobile-browser-wasm.tar.gz.sha256
          if-no-files-found: error
