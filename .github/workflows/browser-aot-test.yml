name: Browser AOT Test (branch vercel-site-aot)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-browser.yml
    with:
      version: ''
      build_number: 0
      source_sha: ${{ github.sha }}
      action_run_id: ${{ github.run_id }}
      version_lyrics: 'browser'
      aot: true

  package:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download browser package
        uses: actions/download-artifact@v4
        with:
          name: OpenUtauMobile-browser-wasm
          path: pkg

      - name: Extract and add vercel.json
        run: |
          mkdir site
          tar -xzf pkg/OpenUtauMobile-browser-wasm.tar.gz -C site
          cat > site/vercel.json << 'EOF'
          {
            "headers": [
              {
                "source": "/(.*)",
                "headers": [
                  { "key": "Cross-Origin-Opener-Policy", "value": "same-origin" },
                  { "key": "Cross-Origin-Embedder-Policy", "value": "require-corp" }
                ]
              }
            ]
          }
          EOF
          ls -la site
          du -sh site

      - name: Upload ready-to-deploy site
        uses: actions/upload-artifact@v4
        with:
          name: vercel-site-aot
          path: site/
          if-no-files-found: error

      - name: Publish site to branch vercel-site-aot
        run: |
          cd site
          git init -b vercel-site-aot
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Build ${{ github.sha }}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" vercel-site-aot
